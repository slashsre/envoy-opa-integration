apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: opa-ms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opa-ms-api-sa
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - pods
  - configmaps
  - endpoints
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opa-ms-api-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opa-ms-api-sa
subjects:
- kind: ServiceAccount
  name: api-sa
  namespace: opa-ms
